<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#212121" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JARVIS" />
    <title>JARVIS Reply Assistant</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="app-main">
        <header class="topbar">
          <div class="topbar-title">
            <div class="brand-mark" aria-hidden="true"><span></span></div>
            <div class="topbar-brand"><strong>JARVIS</strong><span>REPLY ASSISTANT</span></div>
          </div>
          <div class="topbar-actions">
            <div class="topbar-status" id="connectionStatus" data-status="connecting"><span class="status-dot"></span><span id="connectionLabel">connecting</span></div>
            <button class="new-chat-button" id="newThreadButton"><span class="new-chat-plus" aria-hidden="true">＋</span><span>New chat</span></button>
            <button class="install-button" id="installButton" hidden>install app</button>
          </div>
        </header>

        <main class="workspace">
          <section class="conversation-pane" aria-label="Conversation workspace">
            <div class="section-heading conversation-heading">
              <div>
                <p class="eyebrow">Active conversation</p>
                <h1>Conversation <span class="online-pill">local</span></h1>
              </div>
              <span class="conversation-mode">Manual context</span>
            </div>

            <div class="conversation-meta">
              <div class="avatar avatar-jonah">J</div>
              <div>
                <strong>Contact</strong>
                <span>manual context · no live chat connection</span>
              </div>
              <div class="meta-spacer"></div>
              <span class="channel-label">MANUAL PASTE / WHATSAPP</span>
            </div>
            <p class="integration-note">Paste conversation text here · no live WhatsApp access</p>

            <div class="message-stream" id="messageStream" aria-live="polite"></div>

          </section>

          <aside class="intel-pane" aria-label="Reply settings">
            <div class="intel-header">
              <div>
                <p class="eyebrow">REPLY SETTINGS</p>
                <h2>Choose a tone</h2>
              </div>
              <span class="generating-state" id="generatingState">ready</span>
            </div>

            <div class="mode-section">
              <div class="panel-label"><span>response mode</span></div>
              <div class="mode-grid" id="modeGrid"></div>
            </div>

          </aside>

          <div class="composer-wrap">
            <div class="composer-label"><span class="tiny-led"></span> incoming message</div>
            <div class="composer">
              <div class="composer-input-row">
                <textarea id="incomingInput" rows="3" placeholder="Paste or dictate an incoming message..."></textarea>
              </div>
              <div class="composer-actions">
                <div class="composer-left-actions">
                  <button class="primary-button" id="generateButton">Enter <span aria-hidden="true">↵</span></button>
                </div>
                <button class="dictation-button" id="voiceInputButton" type="button" aria-label="Dictate message" aria-pressed="false" title="Dictate message"><span aria-hidden="true">🎙</span></button>
              </div>
            </div>
            <div class="voice-status" id="voiceStatus" aria-live="polite"></div>
          </div>
        </main>

      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
