name: Temporary dependency security repair
on:
  pull_request:
    types: [reopened, ready_for_review, synchronize]
permissions:
  contents: write
jobs:
  fix-deps:
    if: github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-dev vite@6.4.4
      - run: npm audit fix
      - run: npm audit --audit-level=moderate
      - run: node --check server.mjs && node --check app.js && node --check sw.js
      - run: npm test
      - run: npm run build
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore: update patched dev dependencies" && git push origin HEAD:${{ github.head_ref }}; fi