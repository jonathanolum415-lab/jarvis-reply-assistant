name: CI
permissions:
  contents: write
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --save-dev vite@6.4.4
      - run: npm audit fix
      - run: npm audit --audit-level=moderate
      - run: node --check server.mjs
      - run: node --check app.js
      - run: node --check sw.js
      - run: npm test
      - run: npm run build
      - name: Commit dependency fixes
        if: github.event.pull_request.number == 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "Dependencies already updated"; else git commit -m "chore: update audited dependencies" && git push origin HEAD:${{ github.head_ref }}; fi
