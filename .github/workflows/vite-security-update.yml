name: Refresh Vite security fix
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
jobs:
  update-lockfile:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-dev vite@6.4.4
      - run: npm audit fix
      - run: npm audit --audit-level=moderate
      - run: node --check server.mjs
      - run: node --check app.js
      - run: node --check sw.js
      - run: npm test
      - run: npm run build
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "chore: update Vite and audit dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi